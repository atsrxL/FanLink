[platformio]
default_envs = fanlink_tx_esp8285, fanlink_rx_node01

[env]
platform = espressif8266@4.2.1
board = esp8285
framework = arduino
extra_scripts =
  pre:scripts/platformio_patch_radiolib.py
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib@7.7.1
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I include
  -DFANLINK_NETWORK_ID=0x4B4E4C46UL
  -DFANLINK_RADIO_BUSY_TIMEOUT_MS=25UL
  -DRADIOLIB_STATIC_ONLY=1
  -DRADIOLIB_STATIC_ARRAY_SIZE=64
build_src_filter =
  +<common/*.cpp>
  +<app/*.cpp>
  +<main_tx.cpp>
  +<main_rx.cpp>
  +<main_rx_diag.cpp>

[env:fanlink_tx_esp8285]
build_flags =
  ${env.build_flags}
  -DFANLINK_BUILD_TX=1
  -DFANLINK_TARGET_BETAFPV_2400_LITE=1
  -DFANLINK_RADIO_USE_DCDC=0
  -DFANLINK_RADIO_OUTPUT_POWER_DBM=13
build_src_filter =
  ${env.build_src_filter}
  -<main_rx.cpp>

[fanlink_rx_betafpv_lite]
build_flags =
  ${env.build_flags}
  -DFANLINK_BUILD_RX=1
  -DFANLINK_TARGET_BETAFPV_2400_LITE=1
  -DFANLINK_RADIO_USE_DCDC=0
  -DFANLINK_RADIO_OUTPUT_POWER_DBM=13
  -DFANLINK_STATUS_LED_PIN=16
  -DFANLINK_STATUS_LED_ACTIVE_HIGH=1

[env:fanlink_rx_node01]
build_flags =
  ${fanlink_rx_betafpv_lite.build_flags}
  -DFANLINK_NODE_ID=1
  -DFANLINK_FAN_PWM_PIN=3
  -DFANLINK_TACH_PIN=1
  -DFANLINK_GATE_ACTIVE_HIGH=0
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>

[env:fanlink_rx_node02]
build_flags = ${fanlink_rx_betafpv_lite.build_flags} -DFANLINK_NODE_ID=2
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>

[env:fanlink_rx_node02_uart_diag]
build_flags =
  ${fanlink_rx_betafpv_lite.build_flags}
  -DFANLINK_NODE_ID=2
  -DFANLINK_RX_UART_DIAGNOSTIC=1
  -DFANLINK_FAN_PWM_PIN=-1
  -DFANLINK_TACH_PIN=-1
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>

[env:fanlink_rx_node03]
build_flags = ${fanlink_rx_betafpv_lite.build_flags} -DFANLINK_NODE_ID=3
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>

[env:fanlink_rx_node04]
build_flags = ${fanlink_rx_betafpv_lite.build_flags} -DFANLINK_NODE_ID=4
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>

[env:fanlink_rx_node05]
build_flags = ${fanlink_rx_betafpv_lite.build_flags} -DFANLINK_NODE_ID=5
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>

[env:fanlink_rx_node06]
build_flags = ${fanlink_rx_betafpv_lite.build_flags} -DFANLINK_NODE_ID=6
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>

[env:fanlink_rx_node07]
build_flags = ${fanlink_rx_betafpv_lite.build_flags} -DFANLINK_NODE_ID=7
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>

[env:fanlink_rx_node08]
build_flags = ${fanlink_rx_betafpv_lite.build_flags} -DFANLINK_NODE_ID=8
build_src_filter = ${env.build_src_filter} -<main_tx.cpp>
